# Which certificate @RELEASE stands for in mac_permissions.xml: the one the
# applications of this system are signed with, so that they are given
# seinfo="release".
#
# AOSP's line names testkey, because testkey is what AOSP signs with
# (build/target/product/security). A user build of this project is signed with
# the project's own release keys and refuses to build without them (pw3.mk),
# and there the key is called releasekey -- insertkeys.py then looks for a
# testkey.x509.pem that the release key directory has no reason to hold, and
# the build stops before it has compiled anything (first attempt, 2026-10-19).
#
# Only the user line is given here. eng and userdebug builds keep AOSP's
# directory, which has testkey and no releasekey.
[@RELEASE]
USER : $DEFAULT_SYSTEM_DEV_CERTIFICATE/releasekey.x509.pem
