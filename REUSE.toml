# A byte-for-byte copy of LICENSES/Apache-2.0.txt, kept at the root for one
# reason: GitHub works out a repository's licence from a root LICENSE, COPYING
# or LICENSE.md and does not read LICENSES/, so without this the repository
# page shows no licence at all -- which is the first thing many people look at
# to decide whether they may use a project. It is the licence of this project's
# own code and documents; the boot chain under boot/ and the kernel
# configuration are GPL-2.0-only, and every file's own SPDX tag is what
# actually governs it (README.md, "许可").
#
# What this entry is and is not for, because the two tools disagree (a Codex
# review, 2026-10-30). REUSE 3.3 leaves a root LICENSE copy out of Covered
# Files, so `reuse lint` never asks who holds the copyright in it and ignores
# this entry entirely. tools/tests/test_reuse.py has no such exemption: it
# covers every file the repository would publish, and without this entry the
# catch-all at the top would record the Apache Software Foundation's text as
# "2026 The PW3 port authors". Recording somebody else's licence text as ours
# is the whole of what this entry prevents.
[[annotations]]
path = "LICENSE"
precedence = "closest"
SPDX-FileCopyrightText = "2004 The Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"

# stb_image v2.30, unmodified, from https://github.com/nothings/stb
# (device/amazon/pw3/sleep/third_party/README.md). Dual public domain / MIT; the
# MIT text in LICENSES/ is what this entry names, and without the entry the
# catch-all above would record somebody else's library as this project's own
# work under Apache-2.0 -- the fault this file's test was written for.
[[annotations]]
path = "device/amazon/pw3/sleep/third_party/stb_image.h"
precedence = "closest"
SPDX-FileCopyrightText = "Sean Barrett and the stb contributors"
SPDX-License-Identifier = "MIT"

# The three default sleep wallpapers were supplied by the device owner for this
# port's experimental builds (device/amazon/pw3/sleep/wallpapers/PW3-SOURCE.md
# and the NOTICE beside them). They are not this project's work and are not
# under Apache-2.0; the licence reference has no standard identifier because
# none was granted.
[[annotations]]
path = "device/amazon/pw3/sleep/wallpapers/*.png"
precedence = "closest"
SPDX-FileCopyrightText = "The owner of the device this port is prepared for"
SPDX-License-Identifier = "LicenseRef-UserProvided-Wallpaper"
