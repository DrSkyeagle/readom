# Licences of the files that carry no SPDX header of their own (https://reuse.software/).
# A header in a file wins over this list; of the entries below, the last one that
# matches a file applies. Check: reuse lint.
version = 1
SPDX-PackageName = "Readom"
SPDX-PackageDownloadLocation = "NOASSERTION"

# Written for this project: code and documents under Apache-2.0 (README.md, "许可").
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The PW3 port authors"
SPDX-License-Identifier = "Apache-2.0"

